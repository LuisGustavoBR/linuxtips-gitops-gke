name: terraform-dir

# Reusable workflow: plan and apply ONE Terraform folder.
# Called by terraform.yaml and destroy.yaml; never triggered on its own.
on:
  workflow_call:
    inputs:
      dir:
        description: Terraform folder (network, gke...)
        type: string
        required: true
      env:
        description: Environment (GitHub Environment, envs/<env>.tfvars and state prefix)
        type: string
        default: lab
      destroy:
        description: Plan and apply a destroy instead of a normal change
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  DIR: ${{ inputs.dir }}
  ENV: ${{ inputs.env }}
  DESTROY: ${{ inputs.destroy }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform -chdir="$DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=$ENV/$DIR"

      - name: terraform plan
        run: |
          flag=""
          if [ "$DESTROY" = "true" ]; then flag="-destroy"; fi
          terraform -chdir="$DIR" plan ${flag:+"$flag"} -no-color -var-file="envs/$ENV.tfvars" | tee plan.txt
          {
            echo "### Terraform plan${flag:+ (destroy)}: $DIR ($ENV)"
            echo '```'
            cat plan.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform -chdir="$DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=$ENV/$DIR"

      - name: terraform apply
        run: |
          flag=""
          if [ "$DESTROY" = "true" ]; then flag="-destroy"; fi
          terraform -chdir="$DIR" apply ${flag:+"$flag"} -auto-approve -no-color -var-file="envs/$ENV.tfvars"
