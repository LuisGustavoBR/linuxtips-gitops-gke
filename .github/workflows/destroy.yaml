name: destroy-gke

# Manual only: Actions > destroy-gke > Run workflow.
# Destroys Argo CD and then the cluster, in the reverse order they were created.
# The network stays. Run "terraform" again to recreate everything.
on:
  workflow_dispatch:

permissions:
  contents: read

# Same group as the terraform workflow: they never run at the same time.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  argocd:
    uses: ./.github/workflows/_terraform.yaml
    with:
      dir: argocd
      destroy: true
    permissions:
      contents: read
      id-token: write

  gke:
    needs: argocd
    uses: ./.github/workflows/_terraform.yaml
    with:
      dir: gke
      destroy: true
    permissions:
      contents: read
      id-token: write
