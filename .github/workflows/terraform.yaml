name: terraform

on:
  push:
    branches: [main]
    paths:
      - "network/**"
      - "gke/**"
      - ".github/workflows/**"
      - ".tflint.hcl"
      - ".trivyignore.yaml"
  workflow_dispatch:

permissions:
  contents: read

# Two runs at the same time would fight over the same state.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  TFLINT_VERSION: "v0.66.0"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  # Static checks: no cloud credentials, no approval. Mistakes stop here.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in network gke; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: trivy (security misconfigurations)
        run: |
          curl -sSfLo /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy config --exit-code 1 --ignorefile .trivyignore.yaml .

  # Which folders changed in this push? Only those are planned and applied.
  # Manual runs and changes to the workflows run every folder.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      network: ${{ steps.diff.outputs.network }}
      gke: ${{ steps.diff.outputs.gke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed folders
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=false
          changed=""
          if [ "$EVENT" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if grep -qE '^(\.github/workflows/|\.tflint\.hcl|\.trivyignore\.yaml)' <<<"$changed"; then
              all=true
            fi
          fi
          for dir in network gke; do
            if [ "$all" = "true" ] || grep -q "^$dir/" <<<"$changed"; then value=true; else value=false; fi
            echo "$dir=$value" >>"$GITHUB_OUTPUT"
            echo "$dir: $value"
          done

  network:
    needs: [checks, changes]
    if: needs.changes.outputs.network == 'true'
    uses: ./.github/workflows/_terraform.yaml
    with:
      dir: network
    permissions:
      contents: read
      id-token: write

  # Runs after network (when network runs), so its plan always sees the current network.
  gke:
    needs: [checks, changes, network]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.gke == 'true' }}
    uses: ./.github/workflows/_terraform.yaml
    with:
      dir: gke
    permissions:
      contents: read
      id-token: write
